[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ellmos-homebase-mcp"
version = "0.1.0a23"
description = "MCP server that gives local LLMs a complete capability stack: memory, routing, knowledge, swarm coordination, state, API exploration, testing, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Lukas Geiger" }]
keywords = ["mcp", "mcp-server", "llm", "llm-memory", "local-first", "sqlite", "knowledge-base", "agent-orchestration", "swarm-planning", "api-discovery", "plugin-discovery", "ollama", "ai-tools", "i18n", "ellmos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Operating System",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ellmos-homebase-mcp"
Documentation = "https://github.com/ellmos-ai/ellmos-homebase-mcp#readme"
Repository = "https://github.com/ellmos-ai/ellmos-homebase-mcp.git"
Issues = "https://github.com/ellmos-ai/ellmos-homebase-mcp/issues"
Changelog = "https://github.com/ellmos-ai/ellmos-homebase-mcp/blob/main/CHANGELOG.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
dependencies = [
    "mcp>=1.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
routing = ["anthropic>=0.39.0", "google-genai>=1.0.0", "requests>=2.31.0"]
swarm = ["anthropic>=0.39.0", "requests>=2.31.0"]
all = [
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ellmos-homebase = "homebase.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homebase"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
